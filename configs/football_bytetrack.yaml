# ByteTrack optimized for broadcast & tactical football footage.
# Larger track_buffer keeps track IDs alive through camera pans and long occlusions.
# Lower new_track_thresh avoids spawning fresh IDs for partially-visible distant players.
# match_thresh at 0.65 gives robust re-association without false merges.

tracker_type: bytetrack
track_high_thresh: 0.35
track_low_thresh: 0.10
new_track_thresh: 0.40
track_buffer: 90
match_thresh: 0.65
fuse_score: True
